name: Site

# Builds the documentation site whenever something it is made of changes, and
# publishes it to GitHub Pages from master (ADR 0016). Pull requests only
# build, in strict mode: a broken link fails the change instead of reaching
# the published site.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "internal/sitegen/**"
      - "internal/domain/validation/**"
      - "docs/decisoes/**"
      - "docs/anexos/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "internal/sitegen/**"
      - "internal/domain/validation/**"
      - "docs/decisoes/**"
      - "docs/anexos/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# A publication in progress is never cancelled, so that Pages is not left
# half-deployed; a pull request only cares about its latest push.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Instalar o Zensical
        run: python -m pip install -r site/requirements.txt

      # The rejection codes, the ADRs and the changelog are not committed to
      # site/; they are generated from their sources on every build.
      - name: Gerar as paginas derivadas
        run: go run ./internal/sitegen

      - name: Construir
        working-directory: site
        run: zensical build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: site/_build

  deploy:
    name: Publicar
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
