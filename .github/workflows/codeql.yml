name: CodeQL

# GitHub's semantic analysis, with the security-extended query suite. It
# complements gosec (seguranca.yml): CodeQL follows data across functions and
# packages, gosec knows Go-specific patterns. Findings go to the Security tab,
# and the code scanning check fails a pull request that introduces an alert of
# high severity or above.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analisar (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      # Built explicitly rather than by autobuild, so the analysis covers the
      # same packages CI builds.
      - name: Build
        run: go build ./...

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
