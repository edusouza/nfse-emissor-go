name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formatacao
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "Os arquivos abaixo nao estao formatados. Rode 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: Verificar go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Testes
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1
